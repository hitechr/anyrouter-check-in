name: AnyRouter 自动签到
on:
  schedule:
    - cron: '0 1-12 * * *'
    - cron: '10,20,30,40,50 1-12 * * *'
    - cron: '0 13 * * *'
    - cron: '5 16 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 开启调试模式（截图 artifact、详细日志）
        required: false
        default: false
        type: boolean

concurrency:
  group: anyrouter-checkin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkin:
    if: github.event_name != 'schedule' || github.event.schedule == '0 1-12 * * *' || vars.ENABLE_STATS_PAGE == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    outputs:
      stats-ready: ${{ steps.upload-stats.outcome == 'success' }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      DEBUG_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true' && 'true' || 'false' }}
      STATS_ONLY: ${{ github.event_name == 'schedule' && (github.event.schedule == '10,20,30,40,50 1-12 * * *' || github.event.schedule == '0 13 * * *') && 'true' || 'false' }}
    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: "latest"

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: 缓存 UV 依赖
      uses: actions/cache@v5
      id: uv-cache
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 安装依赖
      run: |
        uv sync --frozen
        echo "✅ 环境初始化完成"

    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb fonts-noto-color-emoji fonts-freefont-ttf fonts-unifont \
          fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf

    - name: 缓存 CloakBrowser 二进制
      uses: actions/cache@v5
      id: cloakbrowser-cache
      with:
        path: ~/.cloakbrowser
        key: ${{ runner.os }}-cloakbrowser-v1
        restore-keys: |
          ${{ runner.os }}-cloakbrowser-

    - name: 安装 CloakBrowser
      run: |
        uv run python -m cloakbrowser install
        echo "✅ CloakBrowser 安装完成"

    - name: 恢复余额历史缓存
      uses: actions/cache@v5
      with:
        path: balance_hash.txt
        key: balance-hash-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          balance-hash-${{ github.ref_name }}-
          balance-hash-

    - name: 恢复浏览器 Profile 缓存
      uses: actions/cache@v5
      with:
        path: .browser_profiles
        key: browser-profiles-${{ runner.os }}-v1
        restore-keys: |
          browser-profiles-${{ runner.os }}-

    - name: 配置代理
      env:
        PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
        PROXY_TEST_URL: https://www.google.com/generate_204
        MIHOMO_VERSION: v1.19.27
        PROXY_REQUIRED: false
      run: bash scripts/setup_mihomo_proxy.sh

    - name: 执行签到
      env:
        DEBUG_MODE: ${{ env.DEBUG_MODE }}
        STATS_ONLY: ${{ env.STATS_ONLY }}
        CHECKIN_HEADLESS: false
        CHECKIN_HUMANIZE: true
        CHECKIN_WAIT_TIMEOUT_MS: 120000
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
        BARK_KEY: ${{ secrets.BARK_KEY }}
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
        STATS_OUTPUT_PATH: ${{ vars.ENABLE_STATS_PAGE == 'true' && '.tmp/stats-snapshot.json' || '' }}
      run: |
        xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run checkin.py

    - name: 生成并保存统计页面
      id: build-stats
      if: always() && vars.ENABLE_STATS_PAGE == 'true' && hashFiles('.tmp/stats-snapshot.json') != ''
      run: |
        if git fetch origin stats-data:refs/remotes/origin/stats-data; then
          git worktree add --detach .tmp/stats-data refs/remotes/origin/stats-data
        else
          git worktree add --detach .tmp/stats-data
          git -C .tmp/stats-data switch --orphan stats-data
        fi

        uv run python -m scripts.build_stats_site \
          --snapshot .tmp/stats-snapshot.json \
          --page web/index.html \
          --output .tmp/stats-data \
          --timezone Asia/Shanghai \
          --mode ${{ env.STATS_ONLY == 'true' && 'sample' || 'checkin' }}

        git -C .tmp/stats-data config user.name "github-actions[bot]"
        git -C .tmp/stats-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -C .tmp/stats-data add index.html data
        if ! git -C .tmp/stats-data diff --cached --quiet; then
          git -C .tmp/stats-data commit -m "STATS: 更新账号用量统计"
          git -C .tmp/stats-data push origin HEAD:stats-data
        fi

        mkdir -p .tmp/site
        cp .tmp/stats-data/index.html .tmp/site/index.html
        cp -R .tmp/stats-data/data .tmp/site/data

    - name: 上传统计页面
      id: upload-stats
      if: always() && steps.build-stats.outcome == 'success' && env.STATS_ONLY != 'true'
      uses: actions/upload-pages-artifact@v4
      with:
        path: .tmp/site

    - name: 上传调试截图
      if: always() && env.DEBUG_MODE == 'true'
      env:
        HTTP_PROXY: ''
        HTTPS_PROXY: ''
      uses: actions/upload-artifact@v4
      with:
        name: checkin-screenshots-${{ github.run_id }}
        path: checkin_screenshots/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14

    - name: 停止代理
      if: always()
      run: bash scripts/stop_mihomo_proxy.sh

    - name: 执行结果
      if: always()
      run: |
        echo "签到任务执行完成"
        echo "时间: $(date)"
        if [ "${DEBUG_MODE}" = "true" ] && [ -d checkin_screenshots ] && [ "$(ls -A checkin_screenshots 2>/dev/null)" ]; then
          echo "调试截图已上传为 artifact: checkin-screenshots-${{ github.run_id }}"
          ls -la checkin_screenshots/
        fi

  deploy-stats:
    if: always() && needs.checkin.outputs.stats-ready == 'true'
    needs: checkin
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: 发布统计页面
      id: deployment
      uses: actions/deploy-pages@v4
